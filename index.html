<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0a">
<title>متابعة المندوبين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#0c0c0a; --panel:#16160f; --panel2:#1e1e15; --line:#2b2a20;
  --ink:#f5f3e8; --muted:#9d9a85; --accent:#ffd400; --accent-ink:#17150a;
  --ok:#5fd394; --ok-bg:#15301f; --bad:#ff8a80; --bad-bg:#3a1a17; --wait:#ffd76a; --wait-bg:#3a2f0c;
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.6;min-height:100vh;
  background:radial-gradient(1200px 500px at 50% -10%,#2a2508 0%,transparent 60%),var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
a{color:var(--accent)}

/* الشريط العلوي */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 18px;
  background:rgba(12,12,10,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.brand h1{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.ghost:hover{color:var(--ink);border-color:#4a4836}

/* الحاوية */
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 120px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:1.02rem;font-weight:600}
.muted{color:var(--muted);font-size:.9rem}
.ltr{direction:ltr;unicode-bidi:isolate}

/* الحلقة والبطاقة الرئيسية */
.hero{display:flex;align-items:center;gap:20px;padding:22px}
.ring{position:relative;width:132px;height:132px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);transition:stroke-dashoffset .8s ease;filter:drop-shadow(0 0 6px rgba(255,212,0,.35))}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.ring .num span{color:var(--muted);font-size:.8rem;margin-top:4px}
.hero .info{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero .info h2{font-size:1.25rem}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.pill b{color:var(--ink);font-variant-numeric:tabular-nums}

/* الإحصائيات */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.stat b{display:block;font-size:1.6rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.82rem}

/* القوائم والبطاقات */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0;padding-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.rank{width:28px;height:28px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:.85rem;font-weight:700;flex:0 0 auto}
.rank.me{background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.rejected{background:var(--bad-bg);color:var(--bad)}
.chip.pending{background:var(--wait-bg);color:var(--wait)}
.chip.off{background:var(--panel2);color:var(--muted)}

/* الأزرار والحقول */
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;text-align:center;color:var(--ink)}
.btn:hover{border-color:#4a4836}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ok{color:var(--ok);border-color:#2f6b4a}
.btn.bad{color:var(--bad);border-color:#7a3a35}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.big{padding:16px;font-size:1.1rem;border-radius:16px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px;min-width:0}
.row>.fit{flex:0 0 auto}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:.92rem;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;min-width:0;color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.msg{border-radius:12px;padding:10px 13px;font-size:.93rem}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.good{background:var(--ok-bg);color:var(--ok)}
.msg.warn{background:var(--wait-bg);color:var(--wait)}
.preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--bg)}
.gps{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;color:var(--muted)}
.gps.on{border-color:#2f6b4a;color:var(--ok)}
.gps.offl{border-color:#7a3a35;color:var(--bad)}

/* زر محل جديد الثابت */
.fab{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;
  max-width:560px;margin:0 auto;box-shadow:0 12px 30px rgba(0,0,0,.45);font-size:1.1rem;padding:16px;border-radius:16px}

/* النافذة السفلية للمحل الجديد */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .head{display:flex;align-items:center;justify-content:space-between}

/* الجداول والمسؤول */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:1 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#map{height:320px;border-radius:14px;border:1px solid var(--line);z-index:1}
.shop{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.shop:first-child{border-top:0;padding-top:0}
.shop img{width:120px;height:150px;object-fit:cover;border-radius:12px;background:var(--panel2);cursor:zoom-in}
.shop .meta{display:flex;flex-direction:column;gap:5px;min-width:0;overflow-wrap:anywhere}
@media (max-width:420px){.shop{grid-template-columns:92px 1fr}.shop img{width:92px;height:118px}}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--muted);font-size:.85rem;font-weight:600}
.scroll{overflow-x:auto}

/* الشاشات الكاملة */
.overlay{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.overlay video,.overlay img.full{flex:1;min-height:0;width:100%;object-fit:contain}
.overlay .foot{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));color:#fff;display:flex;gap:10px;align-items:center}
.overlay .foot span{flex:1}
.center{max-width:440px;margin:6vh auto 0;width:100%}
.brandmark{display:flex;justify-content:center;margin-bottom:6px}
.brandmark .logo{width:54px;height:54px;font-size:1.4rem;border-radius:16px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">م</div>
    <div style="min-width:0">
      <h1 id="title">متابعة المندوبين</h1>
      <small id="subtitle"></small>
    </div>
  </div>
  <span id="gps" class="gps" hidden>GPS</span>
  <button id="logout" class="ghost" hidden>خروج</button>
</header>

<main class="wrap" id="app"><p class="muted">جاري التحميل…</p></main>

<button id="fab" class="btn primary fab" hidden>+ محل جديد</button>

<div class="overlay" id="scan" hidden>
  <video id="video" playsinline muted></video>
  <div class="foot"><span id="scanMsg">وجّه الكاميرا على باركود الستاند</span><button class="btn" id="scanClose">إغلاق</button></div>
</div>
<div class="overlay" id="zoom" hidden>
  <img class="full" id="zoomImg" alt="صورة التوثيق">
  <div class="foot"><span></span><button class="btn" id="zoomClose">إغلاق</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
// رابط الخادم: يا تكتبه هنا، يا ينحفظ من شاشة الربط، يا ييجي من رابط المندوبين (#s=...)
const FIXED_API = "";
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number(n || 0).toLocaleString('en-US');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const S = { token: store.get('token', ''), user: store.get('user', null), pos: null, queue: store.get('queue', []), timers: [], watch: null, flushing: false, lastQueueError: '' };
const STATUS = { ok: 'مقبول', pending: 'بانتظار التدقيق', rejected: 'مرفوض' };
const fmtTime = ts => new Date(ts).toLocaleString('ar-IQ-u-nu-latn', { timeZone: 'Asia/Baghdad', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
const bagDay = () => new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10);
function ago(ts) {
  if (!ts) return 'ما دز موقع بعد';
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return 'هسه';
  if (m < 60) return 'قبل ' + m + ' دقيقة';
  if (m < 1440) return 'قبل ' + Math.round(m / 60) + ' ساعة';
  return 'قبل ' + Math.round(m / 1440) + ' يوم';
}
const b64e = t => btoa(unescape(encodeURIComponent(t))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = t => { try { return decodeURIComponent(escape(atob(t.replace(/-/g, '+').replace(/_/g, '/')))); } catch (e) { return ''; } };
const okApi = u => /^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(u) || /^\/api$/.test(u);
(function () {
  const m = /^#s=([\w-]+)$/.exec(location.hash), fromLink = m ? b64d(m[1]) : '';
  if (fromLink && okApi(fromLink)) store.set('api', fromLink);
  window.API_URL = FIXED_API || store.get('api', '');
})();
const shareLink = () => location.href.split('#')[0] + '#s=' + b64e(window.API_URL);

class NetError extends Error {}
async function api(action, data = {}) {
  let res;
  try {
    res = await fetch(window.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: S.token, ...data }) });
  } catch (e) { throw new NetError('ماكو اتصال بالإنترنت'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new NetError('الخادم ما جاوب، حاول مرة ثانية'); }
  if (!j.ok) {
    if (/انتهت الجلسة|موقوف/.test(j.error || '')) signOut();
    throw new Error(j.error || 'صار خطأ');
  }
  return j;
}
function setSession(r) { S.token = r.token; S.user = r.user; store.set('token', S.token); store.set('user', S.user); }
function signOut() {
  S.token = ''; S.user = null; store.del('token'); store.del('user');
  S.timers.forEach(clearInterval); S.timers = [];
  if (S.watch != null) { navigator.geolocation.clearWatch(S.watch); S.watch = null; }
  $('#gps').hidden = true; $('#logout').hidden = true; $('#fab').hidden = true; $('#subtitle').textContent = '';
  closeSheet();
  viewLogin();
}
$('#logout').onclick = signOut;
function msg(el, text, kind = 'err') { if (!el) return; el.className = 'msg ' + kind; el.textContent = text; el.hidden = !text; }
async function busy(btn, fn) {
  const t = btn.textContent; btn.disabled = true; btn.textContent = 'لحظة…';
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = t; }
}
function setHead(title, sub) { $('#title').textContent = title; $('#subtitle').textContent = sub || ''; }

/* ================= البداية ================= */
async function boot() {
  if (!window.API_URL) {
    setHead('متابعة المندوبين', 'ربط الخادم');
    app.innerHTML = `<div class="brandmark"><div class="logo">م</div></div>
      <form class="card center" id="f"><h2>ربط الموقع بالخادم</h2>
      <p class="muted">هذي الخطوة للمسؤول فقط ومرة وحدة. الصق رابط Web app من Google Apps Script (ينتهي بـ /exec). إذا إنت مندوب، اطلب من المسؤول رابط المندوبين.</p>
      <label>رابط الخادم<input id="api-url" class="ltr" required placeholder="https://script.google.com/macros/s/.../exec"></label>
      <div id="m" hidden></div><button class="btn primary">ربط</button></form>`;
    $('#f').onsubmit = ev => { ev.preventDefault(); busy($('#f button'), async () => {
      const u = $('#api-url').value.trim();
      if (!okApi(u)) return msg($('#m'), 'الرابط لازم يبدي بـ https://script.google.com وينتهي بـ /exec');
      window.API_URL = u;
      try { await api('status'); store.set('api', u); boot(); }
      catch (e) { window.API_URL = ''; msg($('#m'), 'الرابط ما جاوب. تأكد إن النشر Web app والوصول Anyone.'); }
    }); };
    return;
  }
  if (S.token && S.user) return S.user.role === 'admin' ? viewAdmin() : viewAgent();
  try {
    const st = await api('status');
    st.hasAdmin ? viewLogin() : viewInit();
  } catch (e) {
    app.innerHTML = `<div class="card center"><div class="msg err">${esc(e.message)}</div><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>`;
  }
}
function viewInit() {
  setHead('متابعة المندوبين', 'إعداد أول مرة');
  app.innerHTML = `<div class="brandmark"><div class="logo">م</div></div>
    <form class="card center" id="f">
      <h2>إنشاء حساب المسؤول</h2>
      <p class="muted">هذي أول مرة ينفتح الموقع. سوّي حسابك كمسؤول، وبعدها تضيف المندوبين من لوحتك.</p>
      <label>اسمك<input id="in-name" required autocomplete="name"></label>
      <label>رقم موبايلك<input id="in-phone" required inputmode="tel" class="ltr" placeholder="07XXXXXXXXX"></label>
      <label>رمز سري (4 إلى 8 أرقام)<input id="in-pin" required inputmode="numeric" type="password" minlength="4" maxlength="8"></label>
      <div id="m" hidden></div>
      <button class="btn primary">إنشاء الحساب</button></form>`;
  $('#f').onsubmit = ev => { ev.preventDefault(); busy($('#f button'), async () => {
    try { setSession(await api('init', { name: $('#in-name').value, phone: $('#in-phone').value, pin: $('#in-pin').value })); viewAdmin(); }
    catch (e) { msg($('#m'), e.message); }
  }); };
}
function viewLogin() {
  setHead('متابعة المندوبين', 'تسجيل الدخول');
  app.innerHTML = `<div class="brandmark"><div class="logo">م</div></div>
    <form class="card center" id="f">
      <h2>تسجيل الدخول</h2>
      <label>رقم الموبايل<input id="lg-phone" required inputmode="tel" class="ltr" placeholder="07XXXXXXXXX" autocomplete="username"></label>
      <label>الرمز السري<input id="lg-pin" required inputmode="numeric" type="password" autocomplete="current-password"></label>
      <div id="m" hidden></div>
      <button class="btn primary">دخول</button>
      <p class="muted">ما عندك رمز؟ اطلبه من المسؤول.</p></form>`;
  $('#f').onsubmit = ev => { ev.preventDefault(); busy($('#f button'), async () => {
    try { setSession(await api('login', { phone: $('#lg-phone').value, pin: $('#lg-pin').value })); boot(); }
    catch (e) { msg($('#m'), e.message); }
  }); };
}

/* ================= الموقع الجغرافي ================= */
let lastSent = { t: 0, lat: 0, lng: 0 };
function meters(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function gpsPill(on, text) { const g = $('#gps'); g.hidden = false; g.className = 'gps ' + (on ? 'on' : 'offl'); g.textContent = text; }
function startTracking() {
  if (!navigator.geolocation) return gpsPill(false, 'الموبايل ما يدعم الموقع');
  gpsPill(false, 'جاري تحديد الموقع');
  S.watch = navigator.geolocation.watchPosition(p => {
    S.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), t: Date.now() };
    gpsPill(true, 'الموقع شغال');
    maybePing();
  }, err => gpsPill(false, err.code === 1 ? 'اسمح بالموقع' : 'الموقع غير متوفر'),
  { enableHighAccuracy: true, maximumAge: 30000, timeout: 30000 });
  S.timers.push(setInterval(maybePing, 60000));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) maybePing(); });
}
async function maybePing(force) {
  if (!S.pos || !S.token || !S.user || S.user.role === 'admin') return;
  const since = Date.now() - lastSent.t, moved = meters(lastSent, S.pos);
  // كل 5 دقايق إذا تحرك أكثر من 40 متر، أو كل 15 دقيقة حتى لو واقف
  if (!force && !(since > 15 * 60e3 || (since > 5 * 60e3 && moved > 40))) return;
  lastSent = { t: Date.now(), lat: S.pos.lat, lng: S.pos.lng };
  try { await api('ping', S.pos); } catch (e) { lastSent.t = Date.now() - 4 * 60e3; }
}
function freshPos() {
  return new Promise(res => {
    if (S.pos && Date.now() - S.pos.t < 60000) return res(S.pos);
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => {
      S.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), t: Date.now() };
      res(S.pos);
    }, () => res(S.pos), { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });
}
let wake = null;
async function setWake(on) {
  try {
    if (on && navigator.wakeLock) wake = await navigator.wakeLock.request('screen');
    else if (wake) { await wake.release(); wake = null; }
  } catch (e) { wake = null; }
  return !!wake;
}

/* ================= شاشة المندوب ================= */
let draft = null;
function ring(today, target) {
  const R = 56, C = 2 * Math.PI * R, pct = Math.min(1, target ? today / target : 0);
  return `<div class="ring" aria-label="${num(today)} من ${num(target)}">
    <svg viewBox="0 0 132 132"><circle class="track" cx="66" cy="66" r="${R}" fill="none" stroke-width="10"/>

async function onPhoto(ev) {

let scanStream = null, scanOn = false;
async function openScanner() {
  const box = $('#sh-code');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return msg(box, 'المتصفح ما يفتح الكاميرا. اكتب الرقم التسلسلي بإيدك، والباركود ينقري من صورة التوثيق.', 'warn');
  try { scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false }); }
  catch (e) { return msg(box, 'ما انفتحت الكاميرا. اسمح للمتصفح بالكاميرا، أو اكتب الرقم التسلسلي بإيدك.', 'warn'); }
  const v = $('#video'); v.srcObject = scanStream; await v.play();
  $('#scan').hidden = false; scanOn = true; $('#scanMsg').textContent = 'وجّه الكاميرا على باركود الستاند';
  let det = null;
  if ('BarcodeDetector' in window) {
    try {
      const sup = await BarcodeDetector.getSupportedFormats();
      const want = ['qr_code', 'code_128', 'code_39', 'code_93'].filter(f => sup.includes(f));
      if (want.includes('qr_code')) det = new BarcodeDetector({ formats: want });
    } catch (e) { det = null; }
  }
  const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
  let qr = '', serial = '', qrAt = 0;
  const tick = async () => {
    if (!scanOn) return;
    if (v.readyState >= 2 && v.videoWidth) {
      try {
        if (det) {
          for (const b of await det.detect(v)) {
            if (b.format === 'qr_code') qr = qr || b.rawValue; else if (b.rawValue) serial = serial || b.rawValue;
          }
        } else if (window.jsQR) {
          const k = Math.min(1, 720 / v.videoWidth); c.width = v.videoWidth * k; c.height = v.videoHeight * k;
          ctx.drawImage(v, 0, 0, c.width, c.height);
          const d = ctx.getImageData(0, 0, c.width, c.height), hit = jsQR(d.data, d.width, d.height);
          if (hit && hit.data) qr = hit.data;
        }
      } catch (e) {}
      if (qr && !qrAt) { qrAt = Date.now(); $('#scanMsg').textContent = 'انقرا الباركود ✓'; if (navigator.vibrate) navigator.vibrate(80); }
      // بعد قراءة QR ننتظر ثانيتين للرقم التسلسلي (الباركود الخطي) إذا المتصفح يدعمه
      if (qr && (serial || !det || Date.now() - qrAt > 2000)) return finishScan(qr, serial);
    }
    setTimeout(tick, 150);
  };
  tick();
}
function closeScanner() {
  scanOn = false; $('#scan').hidden = true;
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}
$('#scanClose').onclick = closeScanner;
function finishScan(qr, serial) {
  closeScanner();
  if (!draft) return;
  draft.qr = qr;
  const inp = $('#sh-serial');
  if (serial && !inp.value.trim()) inp.value = serial;
  if (inp.value.trim()) checkCode();
  else { msg($('#sh-code'), 'الباركود ينقري. اكتب الرقم التسلسلي المكتوب فوقه.', 'good'); inp.focus(); }
}

  if (!r.total && reset) $('#shopList').innerHTML = '<p class="muted">ماكو محلات بهذا الفلتر.</p>';
  const month = A.filt.month;
  r.shops.forEach(s => {
    const el = document.createElement('div'); el.className = 'shop';
    el.innerHTML = `<img data-pid="${esc(s.photoId)}" alt="صورة التوثيق" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
      <div class="meta"><div class="t" style="font-weight:600">${esc(s.shopName)}</div>
      <div><span class="ltr">${esc(s.serial)}</span> <span class="chip ${esc(s.status)}" data-chip>${STATUS[s.status] || esc(s.status)}</span></div>
      <div class="muted">${esc(s.agentName)} · ${fmtTime(s.ts)}</div>
      <div class="muted">${s.lat != null ? `<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${s.lat},${s.lng}">موقع التسجيل</a>` : '<span class="chip rejected">بدون موقع</span>'}
        · ${s.qr ? 'الباركود مقري' : '<span class="chip pending">الباركود ما انمسح</span>'}</div>
      <div class="muted" data-note>${esc(s.note)}</div>
      <div class="row"><button class="btn sm ok">قبول</button><button class="btn sm bad">رفض</button><button class="btn sm bad" data-del>حذف</button></div>
      <div class="row" data-rej hidden><input placeholder="سبب الرفض (يشوفه المندوب)"><button class="btn sm bad fit">تأكيد الرفض</button></div></div>`;
    const img = $('img', el); img.onclick = () => { if (A.photos.has(s.photoId)) { $('#zoomImg').src = A.photos.get(s.photoId); $('#zoom').hidden = false; } };
    photoObs ? photoObs.observe(img) : loadPhoto(img);
    const set = async (btn, status, note) => busy(btn, async () => {
      try { await api('admin.review', { month, id: s.id, status, note });
        const c = $('[data-chip]', el); c.className = 'chip ' + status; c.textContent = STATUS[status]; $('[data-note]', el).textContent = note || ''; $('[data-rej]', el).hidden = true;
      } catch (e) { $('[data-note]', el).textContent = e.message; }
    });
    const [okB, badB] = el.querySelectorAll('.row:not([data-rej]) button');
    okB.onclick = () => set(okB, 'ok', '');
    badB.onclick = () => { $('[data-rej]', el).hidden = false; $('[data-rej] input', el).focus(); };
    $('[data-rej] button', el).onclick = ev => set(ev.target, 'rejected', $('[data-rej] input', el).value.trim() || 'الصورة غير مقبولة');
    $('[data-del]', el).onclick = ev => {
      if (!confirm(`تحذف المحل "${s.shopName}" نهائياً مع صورته؟`)) return;
      busy(ev.target, async () => {
        try { await api('admin.delShop', { month, id: s.id }); el.remove(); A.offset = Math.max(0, A.offset - 1); $('#shopCount').textContent = `${num(Math.max(0, r.total - 1))} محل`; }
        catch (e) { $('[data-note]', el).textContent = e.message; }
      });
    };
    $('#shopList').appendChild(el);
  });
  A.offset += r.shops.length;
  $('#more').hidden = A.offset >= r.total;
}

/* ---- عد الشهر ---- */
function tabMonth() {
  const m = A.month || bagDay().slice(0, 7);
  pane().innerHTML = `<section class="card"><div class="row"><label>الشهر<input type="month" id="mo" value="${m}"></label><button class="btn fit" id="copy">نسخ الجدول</button></div>
    <p class="muted">الأجر ينحسب على المحلات المقبولة فقط: 1,000 دينار للمحل، و1,250 لكل محل فوق 672.</p>
    <div class="scroll" id="moTable"><p class="muted">جاري التحميل…</p></div><div id="moMsg" hidden></div></section>`;
  $('#mo').onchange = () => { A.month = $('#mo').value; loadMonth(); };
  $('#copy').onclick = async () => {
    try { await navigator.clipboard.writeText(A.monthText || ''); msg($('#moMsg'), 'انتسخ الجدول.', 'good'); }
    catch (e) { msg($('#moMsg'), 'ما كدرنا ننسخ. حدد الجدول وانسخه بإيدك.', 'warn'); }
  };
  loadMonth();
}
async function loadMonth() {
  let r;
  try { r = await api('admin.month', { month: $('#mo').value }); } catch (e) { $('#moTable').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  if (A.tab !== 'month') return;
  const sum = k => r.rows.reduce((t, x) => t + x[k], 0);
  $('#moTable').innerHTML = r.rows.length ? `<table><thead><tr><th>المندوب</th><th>مقبول</th><th>بانتظار</th><th>مرفوض</th><th>الأجر (دينار)</th></tr></thead><tbody>
    ${r.rows.map(x => `<tr><td>${esc(x.name)}</td><td><b>${num(x.ok)}</b></td><td>${num(x.pending)}</td><td>${num(x.rejected)}</td><td><b>${num(x.pay)}</b></td></tr>`).join('')}
    <tr><th>المجموع</th><th>${num(sum('ok'))}</th><th>${num(sum('pending'))}</th><th>${num(sum('rejected'))}</th><th>${num(sum('pay'))}</th></tr></tbody></table>
    ${sum('pending') ? `<p class="msg warn">بعد ${num(sum('pending'))} محل بانتظار تدقيقك. دققها قبل ما تعتمد الأجور.</p>` : ''}`
    : '<p class="muted">ماكو مندوبين بعد.</p>';
  A.monthText = `عد شهر ${r.month}\n` + r.rows.map(x => `${x.name}: ${x.ok} مقبول، ${x.pending} بانتظار، ${x.rejected} مرفوض، الأجر ${num(x.pay)} دينار`).join('\n') + `\nالمجموع: ${sum('ok')} محل، ${num(sum('pay'))} دينار`;
}

/* ---- المندوبين ---- */
function tabAgents() {
  pane().innerHTML = `<form class="card" id="af"><h2>إضافة مندوب</h2><div class="row">
    <label>الاسم<input id="ag-name" required></label>
    <label>رقم الموبايل<input id="ag-phone" required inputmode="tel" class="ltr" placeholder="07XXXXXXXXX"></label>
    <label>الرمز السري<input id="ag-pin" required inputmode="numeric" minlength="4" maxlength="8" class="ltr" placeholder="4 أرقام"></label></div>
    <div id="agMsg" hidden></div><button class="btn primary">إضافة</button></form>
    <section class="card"><h2>رابط المندوبين</h2><p class="muted">دز هذا الرابط لكل مندوب ويّه رمزه. يفتحه بموبايله ويدخل مباشرة.</p>
    <input id="share" class="ltr" readonly><div class="row"><button class="btn" id="shareCopy" type="button">نسخ الرابط</button></div><div id="shareMsg" hidden></div></section>
    <section class="card"><h2>الحسابات</h2><div class="list" id="agList"><p class="muted">جاري التحميل…</p></div></section>`;
  $('#af').onsubmit = ev => { ev.preventDefault(); busy($('#af button'), async () => {
    try {
      const pin = $('#ag-pin').value, name = $('#ag-name').value;
      await api('admin.addAgent', { name, phone: $('#ag-phone').value, pin });
      msg($('#agMsg'), `انضاف ${name}. انطيه رقمه والرمز ${pin} حتى يدخل.`, 'good'); $('#af').reset(); loadAgents();
    } catch (e) { msg($('#agMsg'), e.message); }
  }); };
  $('#share').value = shareLink();
  $('#shareCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(shareLink()); msg($('#shareMsg'), 'انتسخ الرابط.', 'good'); }
    catch (e) { $('#share').select(); msg($('#shareMsg'), 'حدد الرابط وانسخه بإيدك.', 'warn'); }
  };
  loadAgents();
}
async function loadAgents() {
  try { A.agents = (await api('admin.overview')).agents; } catch (e) { $('#agList').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  if (A.tab !== 'agents') return;
  const box = $('#agList'); box.innerHTML = '';
  A.agents.forEach(a => {
    const el = document.createElement('div'); el.className = 'item';
    el.innerHTML = `<div class="grow"><div class="t">${esc(a.name)} ${a.role === 'admin' ? '<span class="chip off">مسؤول</span>' : ''} ${a.active ? '' : '<span class="chip rejected">موقوف</span>'}</div>
      <div class="muted ltr" style="text-align:right">0${esc(a.phone)}</div></div>
      <button class="btn sm" data-pin>رمز جديد</button>${a.role === 'admin' ? '' : `<button class="btn sm ${a.active ? 'bad' : 'ok'}" data-act>${a.active ? 'إيقاف' : 'تفعيل'}</button><button class="btn sm bad" data-del>حذف</button>`}
      <div class="row" data-box hidden style="flex-basis:100%"><input inputmode="numeric" class="ltr" placeholder="الرمز الجديد"><button class="btn sm primary fit">حفظ</button></div><div data-m hidden style="flex-basis:100%"></div>`;
    $('[data-pin]', el).onclick = () => { $('[data-box]', el).hidden = false; $('[data-box] input', el).focus(); };
    $('[data-box] button', el).onclick = ev => busy(ev.target, async () => {
      try { await api('admin.setAgent', { id: a.id, pin: $('[data-box] input', el).value }); $('[data-box]', el).hidden = true; msg($('[data-m]', el), 'تغيّر الرمز. انطيه الرمز الجديد.', 'good'); }
      catch (e) { msg($('[data-m]', el), e.message); }
    });
    const act = $('[data-act]', el);
    if (act) act.onclick = () => busy(act, async () => { try { await api('admin.setAgent', { id: a.id, active: !a.active }); loadAgents(); } catch (e) { msg($('[data-m]', el), e.message); } });
    const del = $('[data-del]', el);
    if (del) del.onclick = () => {
      if (!confirm(`تحذف حساب "${a.name}"؟ محلاته تبقى بالجدول.`)) return;
      busy(del, async () => { try { await api('admin.delAgent', { id: a.id }); loadAgents(); } catch (e) { msg($('[data-m]', el), e.message); } });
    };
    box.appendChild(el);
  });
}
boot();
</script>
</body>
</html>
